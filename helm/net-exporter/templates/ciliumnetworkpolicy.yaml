{{ if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.name }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  egress:
  {{- with .Values.networkPolicy.cilium.egress }}
    {{- toYaml . | nindent 4 }}
  {{- else }}
    - toEntities:
        - kube-apiserver
    # NTP checks against public pools.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "123"
              protocol: UDP
    # Latency checks to neighbour net-exporter pods.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: net-exporter
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ .Values.port | quote }}
              protocol: TCP
  {{- end }}
  ingress:
  {{- with .Values.networkPolicy.cilium.ingress }}
    {{- toYaml . | nindent 4 }}
  {{- else }}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
            io.kubernetes.pod.namespace: kube-system
        - matchLabels:
            app.kubernetes.io/name: net-exporter
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ .Values.port | quote }}
              protocol: TCP
  {{- end }}
{{ end }}
